name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      TELEGRAM_BOT_TOKEN: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, bcmath, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend build
        run: npm run build

      - name: Run backend tests
        run: php artisan test

      - name: Composer audit
        run: composer audit

  demo-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hosted demo image
        run: docker build -t nethammereda-demo:ci .
      - name: Smoke-test disposable hosted demo
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -eu
          docker run -d --name nethammereda-demo-ci \
            -p 127.0.0.1:10000:10000 \
            -e APP_ENV=production -e APP_DEBUG=false -e HOSTED_DEMO=true \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/var/www/html/storage/demo.sqlite \
            -e CACHE_STORE=file -e SESSION_DRIVER=file -e APP_KEY="$APP_KEY" \
            nethammereda-demo:ci
          trap 'docker logs nethammereda-demo-ci | tail -60; docker rm -f nethammereda-demo-ci' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/up >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail --silent http://127.0.0.1:10000/api/menu/items | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["data"]) > 0'
          curl --fail --silent -X POST http://127.0.0.1:10000/api/auth/demo-session | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["user"]["role"] == "user"'
